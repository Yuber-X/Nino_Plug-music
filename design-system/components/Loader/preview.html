<!-- @dsCard group="Entrada" height=460 subtitle="Secuencia de carga, inspirada en el sitio de referencia con contador" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Loader — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; }
  body { background: var(--surface-950); }
  .loader {
    position: relative;
    width: 100%; height: 460px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden;
    background: radial-gradient(120% 90% at 72% 30%, var(--wine-900) 0%, var(--surface-950) 62%);
  }
  .loader::before {
    content: "";
    position: absolute; inset: 0;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="6"><rect width="100" height="1" y="0" fill="black" opacity="0.12"/></svg>');
    background-size: 100% 3px;
    mix-blend-mode: overlay;
    pointer-events: none;
  }
  .mark {
    font-family: var(--font-mono);
    letter-spacing: .14em;
    font-size: 12px;
    font-weight: 700;
    color: var(--ash-300);
    margin-bottom: var(--space-6);
  }
  .count-row { display: flex; align-items: baseline; gap: var(--space-3); z-index: 1; }
  .count {
    font-family: var(--font-display);
    font-size: 128px;
    line-height: .9;
    color: var(--bone-100);
    text-shadow: var(--shadow-glow-wine);
  }
  .count .pct { font-size: 48px; color: var(--wine-400); }
  .bar-track {
    position: relative;
    width: 320px; height: 2px;
    background: var(--line);
    margin-top: var(--space-8);
    z-index: 1;
  }
  .bar-fill { position:absolute; left:0; top:0; height:100%; width: 63%; background: var(--wine-400); }
  .name {
    position:absolute; bottom: var(--space-8);
    font-family: var(--font-display);
    font-size: 22px;
    letter-spacing: .04em;
    color: var(--ash-500);
    z-index: 1;
  }
</style>
</head>
<body>
<div class="loader">
  <div class="mark">CARGANDO EXPERIENCIA</div>
  <div class="count-row">
    <div class="count">63<span class="pct">%</span></div>
  </div>
  <div class="bar-track"><div class="bar-fill"></div></div>
  <div class="name">NINO PLUG</div>
</div>
</body>
</html>
