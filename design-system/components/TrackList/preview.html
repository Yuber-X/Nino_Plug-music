<!-- @dsCard group="Reproductor" height=340 subtitle="Lista de pistas con fila activa" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TrackList — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; }
  body { background: var(--surface-950); padding: var(--space-8); box-sizing: border-box; }
  .list { max-width: 640px; border-top: 1px solid var(--line); }
  .row {
    display: grid; grid-template-columns: 32px 1fr auto 40px; align-items: center; gap: var(--space-4);
    padding: var(--space-4) var(--space-3);
    border-bottom: 1px solid var(--line);
  }
  .row.active { background: var(--wine-700); border-color: var(--wine-700); }
  .idx { font-family: var(--font-mono); font-size: 13px; color: var(--ash-500); }
  .row.active .idx { color: var(--bone-100); }
  .meta .name { font-family: var(--font-body); font-size: 16px; font-weight: 600; color: var(--bone-100); }
  .meta .feat { font-family: var(--font-body); font-size: 13px; color: var(--ash-300); margin-top: 2px; }
  .row.active .meta .feat { color: var(--bone-100); opacity: .8; }
  .time { font-family: var(--font-mono); font-size: 13px; letter-spacing: .03em; color: var(--ash-500); }
  .row.active .time { color: var(--bone-100); }
  .play {
    width: 28px; height: 28px; border-radius: var(--radius-full);
    border: 1px solid var(--line-strong); display: flex; align-items: center; justify-content: center;
    color: var(--bone-100); font-size: 11px;
  }
  .row.active .play { background: var(--bone-100); color: var(--wine-700); border-color: var(--bone-100); }
</style>
</head>
<body>
<div class="list">
  <div class="row active">
    <div class="idx">01</div>
    <div class="meta"><div class="name">ASCENSIÓN</div><div class="feat">feat. DJ Kane · Reproduciendo ahora</div></div>
    <div class="time">00:42 / 03:15</div>
    <div class="play">❚❚</div>
  </div>
  <div class="row">
    <div class="idx">02</div>
    <div class="meta"><div class="name">CALLE OSCURA</div><div class="feat">Sencillo</div></div>
    <div class="time">03:02</div>
    <div class="play">▶</div>
  </div>
  <div class="row">
    <div class="idx">03</div>
    <div class="meta"><div class="name">VINO Y HUMO</div><div class="feat">feat. La Insuperable</div></div>
    <div class="time">02:48</div>
    <div class="play">▶</div>
  </div>
</div>
</body>
</html>
